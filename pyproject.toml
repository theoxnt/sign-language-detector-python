[project]
name = "SIGN-LANGUAGE-DETECTOR-PYTHON"
version = "1.0.0"
description = "A Python package for live sign language detection"
license = { file = "LICENSE" }
authors = [
  { name = "Alexandre Ferreira" },
  { name = "Swann" },
  { name = "Yessi" },
  { name = "Théo Nouet" }
]

dependencies = [
    "mediapipe==0.10.9",
    "scikit-learn>=1.2.0",
    "opencv-python>=4.7.0.68",
    "numpy>=1.26.4",
    "language-tool-python>=3.1.0",
    "optuna>=4.6.0"
]

[project.optional-dependencies]
# For CI/CD: Use CPU-only PyTorch to save 3GB disk space
ci = [
  "torch>=2.0.0; platform_system != 'Windows' and platform_system != 'Darwin'",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "coverage>=7.0"
]

# For local development: Full PyTorch with CUDA support
dev = [
  "torch>=2.0.0",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "coverage>=7.0",
  "black",
  "ruff",
  "isort",
  "mypy",
  "safety",
  "bandit[toml]",
  "pip-audit",
  "pytest-asyncio>=0.21.0"
]

[project.scripts]
sign-language-detector = "src.main:sign_language_detector_cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.black]
line-length = 88
target-version = ['py311']
